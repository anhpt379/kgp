name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install pytest
        run: pip install pytest

      - name: Run bash tests
        run: bats tests/*.bats

      - name: Run Python tests
        run: pytest tests/test_format_pods.py -v
